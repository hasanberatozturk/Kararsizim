<nav class="navbar">
  <a class="logo" href="{% url 'polls:list' %}">Kararsızım</a>
  <div class="nav-actions">
    {% if user.is_authenticated %}
      <a class="btn btn-gradient" href="{% url 'polls:create' %}">Anket Oluştur</a>
      <a class="nav-user" href="{% url 'polls:user_polls' user.username %}">@{{ user.username }}</a>
      <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">
        {% csrf_token %}
        <button type="submit" class="btn btn-ghost">Çıkış</button>
      </form>
    {% else %}
      <a class="btn btn-ghost" href="{% url 'accounts:login' %}">Giriş</a>
      <a class="btn btn-gradient" href="{% url 'accounts:register' %}">Kayıt Ol</a>
    {% endif %}
  </div>
</nav>
