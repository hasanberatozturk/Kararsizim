<article class="poll-card" id="poll-{{ poll.pk }}">
  <h2 class="poll-question"><a href="{% url 'polls:detail' poll.pk %}">{{ poll.question }}</a></h2>
  <p class="poll-meta">
    <a href="{% url 'polls:user_polls' poll.author.username %}">@{{ poll.author.username }}</a>
    · {{ poll.created_at|timesince }} önce
  </p>
  {% if poll.description %}<p class="poll-description">{{ poll.description }}</p>{% endif %}
  <div class="poll-body">
    {% include "partials/poll_options.html" %}
  </div>
  {% if user.is_authenticated and user.pk == poll.author_id %}
    <form method="post" action="{% url 'polls:delete' poll.pk %}" class="inline-form"
          onsubmit="return confirm('Bu anketi silmek istediğine emin misin?');">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sil</button>
    </form>
  {% endif %}
</article>
