{% extends "base.html" %}

{% block title %}Giriş · Kararsızım{% endblock %}

{% block content %}
  <h1>Giriş Yap</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-gradient">Giriş yap</button>
  </form>
  <p>Hesabın yok mu? <a href="{% url 'accounts:register' %}">Kayıt ol</a></p>
{% endblock %}
