<!doctype html>
{% load static %}
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kararsızım — Bir sor, herkes oylasın{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Kararsız kaldığın konuları herkese sor, oylarla karar ver.{% endblock %}">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  {% include "partials/navbar.html" %}
  {% include "partials/messages.html" %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/main.js' %}" defer></script>
  <script src="{% static 'js/vote.js' %}" defer></script>
</body>
</html>
