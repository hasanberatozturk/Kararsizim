{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Sayfalama">
    {% if page_obj.has_previous %}
      <a class="btn btn-ghost" href="?{% if sort == 'populer' %}sirala=populer&amp;{% endif %}sayfa={{ page_obj.previous_page_number }}">← Önceki</a>
    {% endif %}
    <span>Sayfa {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn-ghost" href="?{% if sort == 'populer' %}sirala=populer&amp;{% endif %}sayfa={{ page_obj.next_page_number }}">Sonraki →</a>
    {% endif %}
  </nav>
{% endif %}
